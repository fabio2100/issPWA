<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estación espacial</title>
  <link rel="shortcut icon" href="./img/satellite16.png" type="img/svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <div id="app" class="m-3">
    <div v-if='spineActive' class="spinner-border" role="status">
      <span class="sr-only">Loading...</span>
    </div>
    <div v-else>
      <div id="myMap" style="position:relative;width:600px;height:400px;"></div>
      <div class="container">
        <div class="row">
          <div class="col-6">
            <p class="m-2">Pendiente: {{pendiente.toFixed(3)}}</p>
            <p class="m-2">Ángulo (PUNTO CARDINAL): {{cardinal.toFixed(0)}}</p>
            <p class="m-2">Ángulo(rad): {{radianes.toFixed(3)}}</p>
            <p class="m-2">Ángulo (º): {{centigrados>0 ? centigrados.toFixed(3) : (centigrados+360).toFixed(3)}}</p>
          </div>
          <div class="col-6">
            <div class="m-2">Dirección: {{direccion}}</div>
          </div>
        </div>
      </div>
    

    </div>
    
  </div>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
 <script type='text/javascript' src='https://www.bing.com/api/maps/mapcontrol?callback=GetMap' async defer></script>
 <!--   <script src="maps.js"></script>-->
    <script src="index.js"></script>
  <script src="script.js"></script>
</body>
</html>
