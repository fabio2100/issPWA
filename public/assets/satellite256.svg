<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="satelliteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="panelGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34495e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cuerpo principal del satélite -->
  <rect x="24" y="20" width="16" height="24" fill="url(#satelliteGradient)" stroke="#2c3e50" stroke-width="1" rx="2"/>
  
  <!-- Panel solar izquierdo -->
  <rect x="8" y="26" width="12" height="12" fill="url(#panelGradient)" stroke="#34495e" stroke-width="0.5" rx="1"/>
  <g fill="#3498db" opacity="0.4">
    <rect x="9" y="27" width="2" height="2"/>
    <rect x="12" y="27" width="2" height="2"/>
    <rect x="15" y="27" width="2" height="2"/>
    <rect x="9" y="30" width="2" height="2"/>
    <rect x="12" y="30" width="2" height="2"/>
    <rect x="15" y="30" width="2" height="2"/>
    <rect x="9" y="33" width="2" height="2"/>
    <rect x="12" y="33" width="2" height="2"/>
    <rect x="15" y="33" width="2" height="2"/>
  </g>
  
  <!-- Panel solar derecho -->
  <rect x="44" y="26" width="12" height="12" fill="url(#panelGradient)" stroke="#34495e" stroke-width="0.5" rx="1"/>
  <g fill="#3498db" opacity="0.4">
    <rect x="45" y="27" width="2" height="2"/>
    <rect x="48" y="27" width="2" height="2"/>
    <rect x="51" y="27" width="2" height="2"/>
    <rect x="45" y="30" width="2" height="2"/>
    <rect x="48" y="30" width="2" height="2"/>
    <rect x="51" y="30" width="2" height="2"/>
    <rect x="45" y="33" width="2" height="2"/>
    <rect x="48" y="33" width="2" height="2"/>
    <rect x="51" y="33" width="2" height="2"/>
  </g>
  
  <!-- Conexiones de los paneles -->
  <rect x="20" y="31" width="4" height="2" fill="#95a5a6"/>
  <rect x="40" y="31" width="4" height="2" fill="#95a5a6"/>
  
  <!-- Antena principal -->
  <circle cx="32" cy="14" r="3" fill="#e74c3c" stroke="#c0392b" stroke-width="0.5"/>
  <rect x="31" y="14" width="2" height="6" fill="#95a5a6"/>
  
  <!-- Antenas secundarias -->
  <circle cx="28" y="18" r="1.5" fill="#f39c12"/>
  <circle cx="36" y="18" r="1.5" fill="#f39c12"/>
  
  <!-- Detalles del cuerpo -->
  <rect x="26" y="24" width="12" height="1" fill="#2c3e50" opacity="0.3"/>
  <rect x="26" y="32" width="12" height="1" fill="#2c3e50" opacity="0.3"/>
  <rect x="26" y="40" width="12" height="1" fill="#2c3e50" opacity="0.3"/>
  
  <!-- Propulsores -->
  <rect x="30" y="44" width="2" height="4" fill="#e67e22" rx="1"/>
  <rect x="33" y="44" width="2" height="4" fill="#e67e22" rx="1"/>
  
  <!-- Efectos de luz -->
  <ellipse cx="28" cy="24" rx="2" ry="1" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="36" cy="24" rx="2" ry="1" fill="#ffffff" opacity="0.3"/>
</svg>
